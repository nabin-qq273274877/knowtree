name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 守卫：仅当 v* tag 指向 main 分支时，后续打包 job 才真正执行。
  # 在 feature 分支误打 tag 会被此守卫拦截，build / release 保持 skipped，
  # 不会触发「Some jobs were not successful」的失败通知。
  guard:
    runs-on: ubuntu-latest
    outputs:
      onMain: ${{ steps.check.outputs.onMain }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拉取完整历史，确保 origin/main 可用

      - name: Check tag points at main
        id: check
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "onMain=true" >> "$GITHUB_OUTPUT"
            echo "tag $GITHUB_REF_NAME is on main"
          else
            echo "onMain=false" >> "$GITHUB_OUTPUT"
            echo "tag $GITHUB_REF_NAME is NOT on main; skipping CI"
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: guard
    if: needs.guard.outputs.onMain == 'true'
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runs-on: windows-latest
            ext: .exe
          - name: macos-arm64
            runs-on: macos-14 # Apple Silicon
            ext: ""
          - name: macos-amd64
            # macOS 13(Ventura) Intel runner 已于 2025-12 退役，job 会永远排队等不到
            # runner。改用最后一个 x86_64 公共镜像 macos-15-intel(macOS 15 Sequoia)。
            runs-on: macos-15-intel # Intel
            ext: ""
          - name: linux-amd64
            runs-on: ubuntu-22.04
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libnss3-dev

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Embed frontend & build desktop binary
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          # Wails v2 的 macOS 运行时引用了 UTType（来自 macOS 11+ 的
          # UniformTypeIdentifiers.framework），但直接 go build 时 clang 不会自动
          # 链接该 framework，导致 Undefined symbols: _OBJC_CLASS_$_UTType。
          # 这里显式注入链接参数 + 设定最低部署目标，修复 macOS 三平台构建失败。
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '11.0' || '' }}
        run: |
          rm -rf web/dist && mkdir -p web/dist
          cp -r frontend/dist/* web/dist/
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.commit=${GITHUB_SHA::8}"
          NAME="knowtree-desktop-${VERSION}-${{ matrix.name }}${{ matrix.ext }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            CGO_ENABLED=0 go build -tags "desktop,production" -trimpath \
              -ldflags "$LDFLAGS -H windowsgui" -o "dist/$NAME" ./cmd/knowtree-desktop
          else
            go build -tags "desktop,production" -trimpath \
              -ldflags "$LDFLAGS" -o "dist/$NAME" ./cmd/knowtree-desktop
          fi

      - name: Bundle macOS .app
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          NAME="knowtree-desktop-${VERSION}-${{ matrix.name }}"
          APP="dist/${NAME}.app/Contents/MacOS"
          mkdir -p "$APP" "dist/${NAME}.app/Contents/Resources"
          cp "dist/$NAME" "$APP/KnowTree"
          chmod +x "$APP/KnowTree"
          cat > "dist/${NAME}.app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>knowtree-desktop</string>
            <key>CFBundleDisplayName</key><string>知树·KnowTree</string>
            <key>CFBundleIdentifier</key><string>cn.knowtree.desktop</string>
            <key>CFBundleExecutable</key><string>KnowTree</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>icon.icns</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # 图标：有 icns 则拷入；没有也不影响运行（后续可补）
          if [ -f "build/appicon.icns" ]; then cp "build/appicon.icns" "dist/${NAME}.app/Contents/Resources/icon.icns"; fi
          # 去掉裸二进制，只发 .app
          rm "dist/$NAME"
          # 把 .app 目录打成 zip 作为单个文件上传：否则 upload-artifact/download-artifact
          # 会把 .app 内部的 Info.plist/MacOS/Resources 平铺打散，Release 里就只剩散文件
          # 而非完整可用的 .app bundle。macOS 用户下载 zip 双击解压即得 .app。
          ditto -c -k --keepParent "dist/${NAME}.app" "dist/${NAME}.app.zip"
          rm -rf "dist/${NAME}.app"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: knowtree-desktop-${{ matrix.name }}
          path: dist/*

  release:
    name: Publish release
    needs: [guard, build]
    if: needs.guard.outputs.onMain == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: |
          find . -type f \( -name '*.exe' -o -name '*.app' -o -type f \) | sort
          sha256sum knowtree* > checksums.txt || true
          find . -type f ! -name 'checksums.txt' -exec sha256sum {} + > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**
            dist/checksums.txt
